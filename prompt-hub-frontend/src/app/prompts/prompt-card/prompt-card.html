<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="m-0">{{ prompt().title }}</h3>
      <div class="text-sm text-color-secondary">&#64;{{ prompt().author.username }}</div>
    </div>
    <div class="flex gap-2">
      <p-button icon="pi pi-pencil" size="small" text="true"/>
      <p-button
        icon="pi pi-copy"
        label="Copier"
        text="true"
        size="small"
        (onClick)="copyToClipboard(prompt().content)"
      />
    </div>
  </div>
  <textarea pTextarea readonly class="w-full mb-2" rows="8">{{ prompt().content }}</textarea>
  <div class="flex justify-content-between align-items-center">
    <p-tag [value]="prompt().category.name" />
    <div class="flex gap-2 align-items-center">
      <p-button icon="pi pi-thumbs-up" severity="secondary" ariaLabel="Upvote" />
      <span class="text-lg px-1">{{ prompt().score }}</span>
      <p-button icon="pi pi-thumbs-down" severity="secondary" ariaLabel="Downvote" />
    </div>
  </div>
</p-card>
