<p-card>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="title">Titre</label>
      <input formControlName="title" id="title" type="text" pInputText class="w-full" />
      <small class="invalid-feedback">Le titre est requis (max 30 caractères)</small>
    </div>

    <div class="field">
      <label for="content">Contenu</label>
      <textarea formControlName="content" id="content" pTextarea rows="6" class="w-full"></textarea>
      <small class="invalid-feedback">Le contenu est requis</small>
    </div>

    <div class="field">
      <label for="category">Catégorie</label>
      <p-select
        formControlName="categoryId"
        inputId="category"
        class="w-full"
        optionValue="id"
        optionLabel="name"
        placeholder="Choisir une catégorie"
        [options]="categories()"
      />
      <small class="invalid-feedback">La catégorie est requise</small>
    </div>

    <div class="flex justify-content-end gap-2">
      <p-button routerLink="/" label="Annuler" severity="secondary" />
      <p-button type="submit" label="Créer" />
    </div>
  </form>
</p-card>
